spring.application.name=secure-student-portal
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/secure-portal;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# Browser session cookie protections
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Enable secure=true when serving over HTTPS in a deployed environment.
server.servlet.session.cookie.secure=false

# Do not expose stack traces or internal exception details to visitors.
server.error.include-message=never
server.error.include-stacktrace=never
